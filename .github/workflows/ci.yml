name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          $diff = $(gofmt -l $(go list ./...))
          if ($diff) { Write-Error "gofmt needed:`n$diff"; exit 1 }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1

  frontend:
    name: Frontend selfcheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: selfcheck
        run: node frontend/tools/selfcheck.mjs
      - name: smoke
        run: node frontend/tools/smoke.mjs
